baseURL = "https://www.ruudhendrikx.nl/"
languageCode = "en-us"
title = "Ruud Hendrikx"
enableRobotsTXT = true
# the homepage is the room (static/index.html, its files in static/r/35/); Hugo renders every other page
# no categories/tags pages: the site uses no taxonomies
disableKinds = ["home", "taxonomy", "term"]

[params]
  description = "AI Solution Engineer & Technical Leader"
  author = "Ruud Hendrikx"
  # hand-written pages in static/ that Hugo does not know about; layouts/sitemap.xml lists them
  staticPages = ["", "atlas/", "synclipse/", "synclipse/nl/", "synclipse/guide/", "synclipse/nl/gids/", "synclipse/support/", "synclipse/nl/support/", "synclipse/privacy/", "synclipse/nl/privacy/", "synclipse/articles/sound-out-of-sync-tv/", "synclipse/articles/make-tv-picture-faster/", "synclipse/nl/artikelen/geluid-loopt-niet-gelijk-tv/", "synclipse/nl/artikelen/beeld-tv-sneller-maken/"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[sitemap]
  changefreq = "monthly"
  priority = 0.5
